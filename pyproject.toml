[project]
name = "pubmed-insight-demo"
version = "0.1.0"
description = "PubMed research intelligence backend demo"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "lxml>=5.3,<7",
    "networkx>=3.4,<4",
    "numpy>=2.2,<3",
    "pydantic-settings>=2.7,<3",
    "pycountry>=24.6,<25",
    "scikit-learn>=1.6,<2",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the local PostgreSQL test container"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["lxml.*", "networkx.*", "sklearn.*"]
ignore_missing_imports = true

